name: Deploy WhyGraph Image

# Builds and pushes ghcr.io/mtrdesign/whygraph — the self-contained
# scanning-service image, and the only thing `scripts/install.sh` installs:
# that bootstrapper pulls this image and delegates shim generation to the
# in-image `whygraph install` command. Publishing is tied to releases: cutting
# a GitHub release (tagged vX.Y.Z) builds the image, tags it to match that
# version, and bakes WHYGRAPH_VERSION so the shims pin that release. The image
# tag follows the release version 1:1 — and because the front-door URL is
# tag-pinned, a pin-verification step gates the push.

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The release tag drives the image tags. A release `v1.2.3` publishes
      # :1.2.3, :1.2, :1 and :latest, so consumers can pin as loosely or as
      # tightly as they like while the shim's default :latest tracks the
      # newest release.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mtrdesign/whygraph
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      # The front door is a tag-pinned raw URL
      # (raw.githubusercontent.com/.../v1.2.3/scripts/install.sh), so the
      # script's DEFAULT_VERSION and the README URL must both name the release
      # being published. Gated here — before the push — so a forgotten bump is
      # a red release rather than a silently wrong pin.
      - name: Verify the installer pin matches the release
        run: |
          want='${{ steps.meta.outputs.version }}'
          got=$(awk -F'"' '/^DEFAULT_VERSION=/ {print $2; exit}' scripts/install.sh)
          if [ "$got" != "$want" ]; then
            echo "::error::scripts/install.sh has DEFAULT_VERSION=$got but this release is $want — bump it and re-run."
            exit 1
          fi
          if ! grep -q "whygraph/v$want/scripts/install.sh" README.md; then
            echo "::error::README.md install URL is not pinned to v$want — bump it and re-run."
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/whygraph/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CODEGRAPH_VERSION=1.4.1
            WHYGRAPH_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
