name: CI Code Checks

# Runs on every pull request: lints with ruff (lint + format check), runs the
# pytest suite (three shards), and typechecks / tests / builds the playground
# frontend. The jobs run in parallel and gate the PR.

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check src/ tests/ scripts/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ scripts/

  test:
    name: Unit Tests (pytest ${{ matrix.group }}/3)
    runs-on: ubuntu-latest
    # Three shards by stored duration (pytest-split, `.test_durations`), each
    # on every core (xdist). The portal tests start their own Postgres
    # (POSTGRES_IMAGE on a tmpfs, durability off) through Docker on the
    # runner, so CI runs the server users run - no service literal to drift.
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pytest
        run: uv run pytest --splits 3 --group ${{ matrix.group }}

  tests-passed:
    # One stable name for every shard, for a required status check.
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Every shard passed
        run: test "${{ needs.test.result }}" = success

  frontend:
    name: Frontend (typecheck, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/playground
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/playground/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build
