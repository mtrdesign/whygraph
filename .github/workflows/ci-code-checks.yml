name: CI Code Checks

# Runs on every pull request: lints with ruff (lint + format check), runs the
# pytest suite, and typechecks / tests / builds the playground frontend. The
# three jobs run in parallel and gate the PR.

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check src/ tests/ scripts/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ scripts/

  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    # The portal tests need a Postgres. The image literal must equal
    # POSTGRES_IMAGE in src/whygraph/cli/commands/install.py
    # (tests/test_install_script.py gates it).
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pytest
        env:
          # An admin URL: the fixtures create one database per test from it.
          WHYGRAPH_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/postgres
        run: uv run pytest

  frontend:
    name: Frontend (typecheck, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/playground
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/playground/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build
